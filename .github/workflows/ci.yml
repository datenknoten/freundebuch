name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

# Cancel an older CI run on the same ref when a newer one is pushed.
# `release.yml` keeps cancel-in-progress: false because it must finish, but
# CI-only runs are safe (and helpful) to cancel — otherwise stale runs hold
# runner slots and an `aube ci` from a previous commit can race with the new
# install that just landed in the fresh checkout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      - name: Run Biome check
        # `aube run check:ci`, not `check`: `check` is `biome check --write`, so
        # in CI it fixed the checkout and exited 0 — this job could not fail on
        # a formatting or lint violation, which is how unformatted code reached
        # main. `check:ci` is the same Biome run without `--write`.
        #
        # Explicitly `aube run`, because bare `aube check` resolves to aube's
        # built-in dependency-tree verifier rather than our script.
        run: aube run check:ci

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      - name: Type check
        run: aube type-check

  pgtyped-drift:
    name: PgTyped Drift Check
    needs: type-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:18-3.6.1-trixie
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      - name: Apply migrations
        run: aube --filter @freundebuch/backend run migrate

      - name: Regenerate PgTyped queries
        run: aube --filter @freundebuch/backend run pgtyped

      - name: Fail on drift
        # The committed .queries.ts files must match what the migrated schema
        # produces; otherwise a renamed column ships as a type lie.
        run: git diff --exit-code -- apps/backend/src/models/queries

  migrations:
    name: Migration Round-Trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:18-3.6.1-trixie
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      # A migration nobody ever rolls back is a migration whose down() is
      # fiction. Rolling the whole chain back and forward keeps it honest, and
      # keeps `migrate:down` usable during an incident.
      - name: Migrate up
        run: aube --filter @freundebuch/backend run migrate

      - name: Migrate all the way down
        run: |
          count=$(ls database/migrations/*.ts | wc -l)
          echo "Rolling back $count migrations"
          aube --filter @freundebuch/backend run migrate:down "$count"

      - name: Migrate up again
        run: aube --filter @freundebuch/backend run migrate

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    # Both suites need Postgres. The PHP integration tests used to start their
    # own testcontainer, which fails on the runner inside the PHP client
    # ("Container::$id must not be accessed before initialization"), and the JS
    # suites paid for a container start too. One service for both, selected via
    # TEST_DATABASE_URL, which each suite already honours.
    services:
      postgres:
        image: imresamu/postgis:18-3.6.1-trixie
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # Not "test": the JS global-setup drops and recreates a database of
          # that exact name as its clone template and drops it again on
          # teardown, which would delete the database the PHP suite migrates
          # into. Both suites take this URL and use it differently — the JS one
          # as a server pointer, the PHP one as its actual database.
          POSTGRES_DB: sabredav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sabredav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, curl
          coverage: none

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: apps/sabredav

      - name: Run unit and integration tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/sabredav
        run: aube test

      # Advisories in the PHP tree are as production-relevant as the JS ones;
      # this is the only place composer.lock is installed.
      #
      # Report-only for the same reason as the osv-scanner step: the tree
      # already carries advisories (guzzlehttp/psr7 in the runtime deps,
      # phpunit and symfony/process in the dev ones) that a dependency bump
      # fixes, not the PR under test.
      - name: Audit PHP dependencies
        continue-on-error: true
        run: composer audit --no-interaction
        working-directory: apps/sabredav

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: imresamu/postgis:18-3.6.1-trixie
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      # The whole suite, integration included. It was excluded while every
      # integration file started its own container and the timeouts were
      # vitest's 5s/10s defaults, which v8 instrumentation blew through. Both
      # of those are gone (one shared template, 30s/60s timeouts), and
      # excluding it made the coverage report actively misleading: `utils/
      # http.ts` is used by all 14 route files and still reported 0%.
      - name: Run backend tests with coverage
        env:
          NODE_ENV: test
          # global-setup builds its template on this server instead of starting
          # its own container.
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/postgres
        run: aube --filter @freundebuch/backend exec vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/clover.xml
          if-no-files-found: error

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Scans the resolved lockfiles rather than the manifests, so transitive
      # advisories surface too.
      #
      # Report-only. The scanner exits non-zero on any advisory, and the tree
      # already carries a backlog of them (svelte, undici, vite, vitest, uuid,
      # xml2js at the time of writing) whose fix is a dependency bump, not a
      # code change in the PR being tested. Gating here would red-light every
      # unrelated PR until Renovate lands those upgrades. The report stays
      # visible in the job log; make this blocking once the backlog is clear.
      - name: Scan lockfiles with osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --lockfile=apps/sabredav/composer.lock

  danger:
    name: Danger PR Checks
    needs: backend-coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      - name: Generate frontend coverage
        # Fast (jsdom, no DB/Docker), so produce the clover report here rather
        # than ferrying an artifact around.
        # Build shared first: frontend tests import runtime values from $shared
        # (-> shared/dist), which isn't built by `aube ci`.
        run: |
          aube --filter @freundebuch/shared run build
          aube --filter @freundebuch/frontend run test:coverage

      # The backend report needs a Postgres service and v8 instrumentation, so
      # it is produced by `backend-coverage` and ferried in here — the coverage
      # rule reads both clover files from the workspace paths.
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage

      - name: Run Danger
        run: npx danger ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Resolve aube store path
        shell: bash
        run: echo "AUBE_STORE=$(aube store path 2>/dev/null || echo $HOME/.local/share/aube/store)" >> "$GITHUB_ENV"

      - name: Setup aube cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUBE_STORE }}
          key: ${{ runner.os }}-aube-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-aube-store-

      - name: Install dependencies
        run: aube ci

      - name: Build all workspaces
        run: aube build

  docker-smoke:
    name: Docker Build Smoke Test
    # PR-only: pushes to main go through the release workflow, which builds and
    # publishes the real multi-arch images. This is a fast amd64 build that
    # catches Dockerfile/toolchain breakage (e.g. the aube/mise install) before
    # merge, then verifies native modules actually load at runtime.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend.prod
          target: backend
          load: true
          tags: freundebuch-backend:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=ci-backend-prod
          cache-to: type=gha,mode=max,scope=ci-backend-prod

      - name: Build mcp-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend.prod
          target: mcp-server
          load: true
          tags: freundebuch-mcp-server:ci
          platforms: linux/amd64
          # Shares the builder layers with the backend build above.
          cache-from: type=gha,scope=ci-backend-prod
          cache-to: type=gha,mode=max,scope=ci-backend-prod

      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.nginx.prod
          load: true
          tags: freundebuch-nginx:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=ci-nginx
          cache-to: type=gha,mode=max,scope=ci-nginx

      # Different toolchain path from the others: this one installs mise via
      # the shell installer on node:24-bookworm-slim (the mise base image has
      # no php8.2), so it breaks independently of Dockerfile.backend.prod.
      # Without a build here the first attempt happens in release.yml, after
      # semantic-release has already tagged and published.
      - name: Build all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          load: true
          tags: freundebuch-all-in-one:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=ci-all-in-one
          cache-to: type=gha,mode=max,scope=ci-all-in-one

      - name: Smoke test images
        run: |
          # Resolve modules from each app's own directory: in the pnpm/aube
          # workspace layout a package's deps live under apps/<name>/node_modules
          # (symlinked to the virtual store), not the repo-root node_modules. This
          # matches how the real CMD (node apps/<name>/dist/index.js) resolves them.
          docker run --rm -w /app/apps/backend freundebuch-backend:ci node -e "require('bcrypt'); require('sharp');"
          docker run --rm -w /app/apps/mcp-server freundebuch-mcp-server:ci node -e "require('bcrypt');"
          # Frontend build produced static assets served by nginx.
          docker run --rm freundebuch-nginx:ci test -f /app/frontend/index.html
          # The all-in-one entrypoint migrates before starting supervisord, so
          # the migrator has to run inside the pruned production tree: its `pg`
          # peer is only a root devDependency and is reachable through the
          # virtual store alone. Point it at a dead port — a refused connection
          # proves the CLI, `pg` and database/dist are all there.
          docker run --rm -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/none freundebuch-all-in-one:ci \
            node /app/node_modules/node-pg-migrate/bin/node-pg-migrate.js \
            --decamelize --migrations-dir /app/database/dist up 2>&1 | grep -q ECONNREFUSED
          echo "Docker smoke tests passed"

