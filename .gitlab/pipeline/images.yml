# Container images, published to registry.gitlab.com/datenknoten/freundebuch/<image>.

# Sequential build of all six images for one architecture. ARCH is supplied by the
# concrete jobs below.
.build-images:
  # .buildx: the docker-container driver required by --cache-to type=registry.
  extends: .buildx
  stage: build
  # DAG: tag pipelines contain no earlier jobs; start immediately.
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  # A release must finish even when a newer pipeline appears.
  interruptible: false
  timeout: 2h
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for IMAGE in nginx backend mcp-server sabredav osm-import all-in-one; do
        TARGET=""
        case "$IMAGE" in
          nginx)      DOCKERFILE=docker/Dockerfile.nginx.prod ;;
          backend)    DOCKERFILE=docker/Dockerfile.backend.prod ;;
          mcp-server) DOCKERFILE=docker/Dockerfile.backend.prod; TARGET=mcp-server ;;
          sabredav)   DOCKERFILE=docker/Dockerfile.sabredav.prod ;;
          osm-import) DOCKERFILE=docker/Dockerfile.osm-import ;;
          all-in-one) DOCKERFILE=Dockerfile; TARGET=production ;;
        esac
        IMG="$CI_REGISTRY_IMAGE/$IMAGE"
        set --
        # nginx and all-in-one bake a frontend and take its Sentry build arg.
        if [ "$IMAGE" = "nginx" ] || [ "$IMAGE" = "all-in-one" ]; then set -- --build-arg "VITE_SENTRY_DSN=$VITE_SENTRY_DSN"; fi
        if [ -n "$TARGET" ]; then set -- "$@" --target "$TARGET"; fi
        echo "=== building $IMAGE ($ARCH) ==="
        # provenance/sbom off: they turn a single-platform build into a manifest
        # list, which breaks the per-arch fan-in in the manifest job.
        docker buildx build "$@" \
          --platform "linux/$ARCH" \
          --file "$DOCKERFILE" \
          --tag "$IMG:$VERSION-$ARCH" \
          --cache-from "type=registry,ref=$IMG:buildcache-$ARCH" \
          --cache-to "type=registry,ref=$IMG:buildcache-$ARCH,mode=max" \
          --provenance=false \
          --sbom=false \
          --push \
          .
      done

build:amd64:
  extends: .build-images
  variables:
    ARCH: amd64
  tags: [saas-linux-medium-amd64]

# Native arm64 instead of QEMU; medium is the smallest Premium arm64 machine type.
build:arm64:
  extends: .build-images
  variables:
    ARCH: arm64
  tags: [saas-linux-medium-arm64]

manifest:
  extends: .docker
  stage: manifest
  needs: [build:amd64, build:arm64]
  rules:
    - if: $CI_COMMIT_TAG
  interruptible: false
  variables:
    COSIGN_VERSION: v3.1.3
    COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
    SYFT_VERSION: 1.52.0
    SYFT_SHA256: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
  # Keyless signing: GitLab mints an OIDC token with aud=sigstore, and cosign picks
  # it up from $SIGSTORE_ID_TOKEN automatically. No key material exists anywhere.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - !reference [.docker, before_script]
    # Pinned static binary: `apk add cosign` floats with the alpine base of
    # docker:29-cli (3.24 ships v3.0.6, 3.22 shipped v2.4.3 — and v2/v3 store
    # signatures in different places).
    - wget -qO /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
    - chmod +x /usr/local/bin/cosign
    # Same reasoning for syft: the SBOM generator is pinned, not floated.
    - wget -qO syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
    - echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
    - tar -xzf syft.tgz -C /usr/local/bin syft
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for IMAGE in nginx backend mcp-server sabredav osm-import all-in-one; do
        IMG="$CI_REGISTRY_IMAGE/$IMAGE"
        # Tag set: version, major.minor, major, latest.
        docker buildx imagetools create \
          --tag "$IMG:$VERSION" \
          --tag "$IMG:${VERSION%.*}" \
          --tag "$IMG:${VERSION%%.*}" \
          --tag "$IMG:latest" \
          "$IMG:$VERSION-amd64" "$IMG:$VERSION-arm64"
        # Sign the fused index by digest; the index digest commits to both arch
        # manifests, so --recursive is unnecessary. cosign v3 stores the signature
        # as an OCI referrer, which lands as an extra `sha256-<hex>` tag here
        # (GitLab's registry has no referrers listing API). cosign reuses the
        # docker login above through the default docker-config keychain.
        DIGEST="$(docker buildx imagetools inspect "$IMG:$VERSION" --format '{{.Manifest.Digest}}')"
        cosign sign --yes "$IMG@$DIGEST"
        # Verify in-job so a signature-storage regression fails this pipeline
        # instead of a consumer. Identity = https:// + ci_config_ref_uri claim;
        # the double slash is load-bearing, and the path names the top-level
        # .gitlab-ci.yml even though this job is defined in an included file.
        cosign verify \
          --certificate-oidc-issuer "$CI_SERVER_URL" \
          --certificate-identity "$CI_PROJECT_URL//.gitlab-ci.yml@refs/tags/$CI_COMMIT_TAG" \
          "$IMG@$DIGEST" > /dev/null
        # SPDX SBOM of the signed index, attached to the same digest as a
        # signed attestation, and verified in-job for the same reason.
        syft "$IMG@$DIGEST" -o spdx-json="sbom-$IMAGE.spdx.json"
        cosign attest --yes --type spdxjson --predicate "sbom-$IMAGE.spdx.json" "$IMG@$DIGEST"
        cosign verify-attestation --type spdxjson \
          --certificate-oidc-issuer "$CI_SERVER_URL" \
          --certificate-identity "$CI_PROJECT_URL//.gitlab-ci.yml@refs/tags/$CI_COMMIT_TAG" \
          "$IMG@$DIGEST" > /dev/null
      done
  artifacts:
    paths:
      - sbom-*.spdx.json
    expire_in: 1 year

# MR-only: pushes to main and tags build the real images instead.
docker-smoke:
  extends: .buildx
  stage: check
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags: [saas-linux-medium-amd64]
  script:
    - docker buildx build --load --file docker/Dockerfile.backend.prod --target backend
      --tag freundebuch-backend:ci --platform linux/amd64
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/backend:buildcache-amd64" .
    - docker buildx build --load --file docker/Dockerfile.backend.prod --target mcp-server
      --tag freundebuch-mcp-server:ci --platform linux/amd64
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/mcp-server:buildcache-amd64" .
    - docker buildx build --load --file docker/Dockerfile.nginx.prod
      --tag freundebuch-nginx:ci --platform linux/amd64
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/nginx:buildcache-amd64" .
    - docker buildx build --load --file Dockerfile --target production
      --tag freundebuch-all-in-one:ci --platform linux/amd64
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/all-in-one:buildcache-amd64" .
    # Resolve modules from each app's own directory, the way the real CMD does.
    - docker run --rm -w /app/apps/backend freundebuch-backend:ci node -e "require('bcrypt'); require('sharp');"
    - docker run --rm -w /app/apps/mcp-server freundebuch-mcp-server:ci node -e "require('bcrypt');"
    - docker run --rm freundebuch-nginx:ci test -f /app/frontend/index.html
    # The all-in-one entrypoint runs migrations first; an unreachable database
    # proves the bundled migrator and its modules resolve. Piping into `grep -q`
    # would close the pipe on the first match, and pipefail turns the container's
    # SIGPIPE into exit 141, so the output goes through a file.
    - docker run --rm -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/none freundebuch-all-in-one:ci
      node /app/node_modules/node-pg-migrate/bin/node-pg-migrate.js --decamelize --migrations-dir /app/database/dist up > all-in-one-migrate.log 2>&1 || true
    - grep -q ECONNREFUSED all-in-one-migrate.log
    - echo "Docker smoke tests passed"

# Only runs when a webhook is configured: without $DEPLOYMENT_NOTIFICATION the
# curl below posts to an empty URL and fails, adding a second red job to every
# red pipeline.
notify-failure:
  stage: notify
  rules:
    - if: ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main") && $DEPLOYMENT_NOTIFICATION
      when: on_failure
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST "$DEPLOYMENT_NOTIFICATION" -H "Content-Type: application/json" \
        -d "{\"text\": \"❌ **Release pipeline failed**\n\n**Repository:** ${CI_PROJECT_PATH}\n**Pipeline:** ${CI_PIPELINE_URL}\"}"
