# GitLab CI. GitLab is the source of truth for this project: merge requests, CI,
# semantic-release and the container images all live here.
#
# Checks run on merge requests and on pushes to main. The `release` job runs on
# main's push (and manually started web) pipelines: semantic-release creates the
# tag, the CHANGELOG entry and the GitLab release.
#
# The tag pipeline (build -> manifest) cannot come from the tag push
# itself: every semantic-release commit says "[skip ci]", and GitLab skips
# push-sourced pipelines on such commits. The release job therefore creates it
# over the REST API, where POST /projects/:id/pipeline sets ignore_skip_ci.
#
# The checks run on the code under review (MR/branch pipeline) and the images are
# built from the tag, so the check stage is excluded from tag pipelines rather
# than re-run against the release commit.

include:
  - local: .gitlab/pipeline/defaults.yml
  - local: .gitlab/pipeline/checks.yml
  - local: .gitlab/pipeline/release.yml
  - local: .gitlab/pipeline/images.yml

stages:
  - check
  - release
  - build
  - manifest
  - notify

workflow:
  rules:
    # A mirrored tag push is skipped anyway ([skip ci] release commit); refuse it
    # explicitly so a hand-pushed tag can never produce a second publish pipeline
    # next to the API-created one.
    - if: $CI_COMMIT_TAG && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
