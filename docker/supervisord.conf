[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:backend]
command=node /app/apps/backend/dist/index.js
directory=/app/apps/backend
user=node
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
# Both: NODE_ENV is Node's own switch, ENV is what ConfigSchema reads and it
# defaults to "development". With NODE_ENV alone this image ran the backend as
# a development deployment.
environment=NODE_ENV="production",ENV="production"
priority=20

[program:mcp-server]
command=node /app/apps/mcp-server/dist/index.js
directory=/app/apps/mcp-server
user=node
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",ENV="production"
priority=25

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 -F
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=15
